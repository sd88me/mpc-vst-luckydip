# Builds lucky-dip for Gen1 (armv7) and Gen2 (aarch64), packages the zips with mpc-vst-plugins' release.py and attaches them to a DRAFT
# release. A person installs that exact zip on a device and publishes the draft (mpc-vst-plugins docs/RELEASING.md).
# Move the pin (both places) to the current main of open-mpc/mpc-vst-plugins before each release.
name: Release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 1.0.1
        required: true
      dry_run:
        description: Zip as a run artifact only, no draft release
        type: boolean
        default: true

jobs:
  release:
    uses: open-mpc/mpc-vst-plugins/.github/workflows/vst-release.yml@1777e405a4c15c380f7a1b1adf673dd73c1a0585
    permissions: { contents: write }
    with:
      tag: lucky-dip-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 1777e405a4c15c380f7a1b1adf673dd73c1a0585
      sdk_project: .
      plugin_id: lucky-dip
      license: GPL-3.0-or-later
      about: "A random 16-pad drum-kit builder: dips into your sample library, fills the pads at random and exports the kit as an MPC drum program."
      user_data: luckydip
      dry_run: ${{ inputs.dry_run }}
